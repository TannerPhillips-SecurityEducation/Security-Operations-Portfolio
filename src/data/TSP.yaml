# Tanner S. Phillips | public personal identity
# Canonical source for the interactive homepage introduction.
identity:
  name: Tanner S. Phillips
  monogram: TSP
  headline: Security Educator, Engineer & Researcher
  introduction: >-
    I'm Tanner. I enjoy getting beneath the surface of complicated things.
    Sometimes that's a network conversation hidden inside a packet capture;
    sometimes it's a philosophical question, a small software experiment,
    or an idea for a world that doesn't exist yet. I like to understand the
    structure behind what I'm seeing, test my assumptions, and turn what I
    discover into something useful. My work spans security and education,
    but my curiosity extends into engineering, writing, computing, and
    creative exploration.
