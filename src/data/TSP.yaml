perspective:
  on_understanding: >-
    I want to distinguish what I observe, what I can derive from it,
    and what I infer might be true. A useful explanation should
    survive closer examination, even when the evidence is incomplete.
  on_learning: >-
    I learn by exploring concepts, testing ideas, making things,
    and reflecting on what changes when an assumption turns out to
    be wrong. I value the freedom to ask questions and make mistakes.
  on_creating: >-
    Whether I'm developing a technical lab, a written reference,
    or a personal experiment, I want the result to reveal more
    about how the underlying system works.
